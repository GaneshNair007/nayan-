# NAYAN India Emergency Detector V2 Training Config
path: C:\nayan\datasets\nayan_india_v2
train: images/train
val: images/val
test: images/test

nc: 6
names:
  0: ambulance
  1: car
  2: motorcycle
  3: auto_rickshaw
  4: bus
  5: truck

# Training parameters
model: yolov8n.pt
epochs: 40
patience: 10
batch: 16
imgsz: 640
device: cuda:0
workers: 4
save: true
exist_ok: true
pretrained: true
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
box: 7.5
cls: 0.5
dfl: 1.5
