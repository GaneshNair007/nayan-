# NAYAN India Emergency Traffic Training Configuration
# Tailored for NVIDIA GeForce RTX 4050 Laptop GPU (6GB VRAM)

base_model: yolov8n.pt
dataset: datasets/nayan_india/dataset.yaml
epochs: 40
batch_size: 8
imgsz: 640
device: 0
workers: 0
seed: 42
optimizer: AdamW
learning_rate: 0.001
lr0: 0.001
lrf: 0.01
patience: 10
AMP: true
save: true
val: true
exist_ok: true
project: artifacts/models
name: nayan_india

# Augmentation settings tailored for Indian road conditions
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
